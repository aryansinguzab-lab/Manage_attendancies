<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance Tracker Pro</title>
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <script src="face-api.min.js"></script>
    
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        
        .video-container { 
            position: relative; width: 320px; height: 200px; margin: 0 auto 20px auto; 
            background: #000; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; border: 2px solid #334155;
        }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
        
        #capture-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(34, 197, 94, 0.9); color: white; padding: 12px 20px;
            border-radius: 8px; font-weight: bold; display: none; z-index: 10; font-size: 16px;
        }
        
        #capture-overlay { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%);
    background: rgba(34, 197, 94, 0.9); 
    color: white; 
    padding: 20px;
    border-radius: 12px; 
    font-weight: bold; 
    display: none; 
    z-index: 10; 
    min-width: 180px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.2);
    transition: opacity 0.3s ease;
}

/* Custom Alert Styles */
.custom-alert-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); display: none; align-items: center;
    justify-content: center; z-index: 9999; backdrop-filter: blur(4px);
}
.custom-alert-box {
    background: #1e293b; border: 1px solid #334155; padding: 25px;
    border-radius: 15px; width: 90%; max-width: 350px; text-align: center;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}
.custom-alert-box h3 { margin-top: 0; color: #3b82f6; }
.custom-alert-box p { color: #94a3b8; margin-bottom: 20px; }
.custom-alert-input { margin-bottom: 15px !important; }

        .card { 
            background: #1e293b; padding: 24px; border-radius: 15px; 
            max-width: 400px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        
        button { 
            background: #3b82f6; color: white; border: none; padding: 12px; 
            border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; 
            transition: 0.2s; font-size: 14px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-secondary { background: #475569; }
        .btn-sleep { background: #ef4444; }
        .btn-wake { background: #22c55e; }
        .btn-settings { position: absolute; top: 10px; right: 10px; width: 35px; height: 35px; padding: 0; background: #334155; border-radius: 50%; border:none; cursor:pointer;}
        
        input { 
            width: 100%; box-sizing: border-box; padding: 12px; 
            margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; 
            background: #0f172a; color: white; text-align: center;
        }
        
        #status { font-size: 13px; margin-bottom: 15px; color: #94a3b8; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20; }
        .modal-content { background: #1e293b; margin: 5% auto; padding: 20px; width: 90%; max-width: 450px; border-radius: 15px; text-align: left; }
        .record-list { height: 300px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #334155; }
        .record-item { border-bottom: 1px solid #334155; padding: 10px 5px; display: flex; justify-content: space-between; font-size: 14px; }
        
        .search-box { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-box input { margin-bottom: 0; text-align: left; }
    </style>
</head>
<body>

    <h2 id="displayCompanyName" style="margin-bottom: 20px; color: #3b82f6;">AI Attendance System</h2>
    
    <div class="video-container">
        <video id="video" autoplay muted playsinline></video>
        <div id="sleep-msg" style="display:none; color: #64748b; font-weight: bold;">[ CAMERA OFF ]</div>
        <div id="capture-overlay">FACE CAPTURED</div>
    </div>
    
    <div class="card">
        <button class="btn-settings" onclick="openSettings()">⚙️</button>
        <div id="status">Waking up AI...</div>
        
        <button id="toggleBtn" class="btn-sleep" onclick="toggleCamera()">Sleep Camera</button>
        
        <div style="margin: 20px 0; border-top: 1px solid #334155;"></div>
        
        <input type="text" id="nameInput" placeholder="Enter name to register">
        
        <div class="button-group">
            <button onclick="registerFace()">Register Face</button>
            <button class="btn-secondary" onclick="openAttendanceWithAuth()">Attendance</button>
        </div>
    </div>

    <div id="recordsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">Attendance Database</h3>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search person's name...">
                <button style="width: 80px;" onclick="searchPerson()">Search</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-size: 12px; color: #94a3b8;">Filter by Date:</label>
                <button style="width: auto; padding: 4px 10px; font-size: 11px;" onclick="loadAttendance()">Show All Today</button>
            </div>
            <input type="date" id="dateFilter" onchange="loadAttendance()" style="margin-top:5px;">
            <div class="record-list" id="modalLogs"></div>
            <button class="btn-secondary" onclick="closeModal('recordsModal')">Close</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">System Settings</h3>
            <label>Company Name</label>
            <input type="text" id="setCompanyName" placeholder="e.g. Acme Corp">
            <label>Access Password</label>
            <input type="password" id="setPass" placeholder="New Password">
            <button onclick="saveSettings()">Save & Close</button>
            <button class="btn-secondary" style="margin-top:10px" onclick="closeModal('settingsModal')">Cancel</button>
        </div>
    </div>

    <script>
        // --- 1. OFFLINE SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log("Offline Mode Active"))
                    .catch(err => console.log("Offline Sync Failed", err));
            });
        }

        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        const sleepMsg = document.getElementById('sleep-msg');
        const captureOverlay = document.getElementById('capture-overlay');
        const modalLogs = document.getElementById('modalLogs');
        
        let db;
        let registeredFaces = [];
        let isSleeping = false;
        let scanInterval;

        async function init() {
            const savedName = localStorage.getItem('companyName') || "AI Attendance System";
            document.getElementById('displayCompanyName').innerText = savedName;
            document.getElementById('setCompanyName').value = savedName;

            const request = indexedDB.open("FaceTrackerDB", 2);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if(!db.objectStoreNames.contains("members")) db.createObjectStore("members", { keyPath: "name" });
                if(!db.objectStoreNames.contains("attendance")) db.createObjectStore("attendance", { autoIncrement: true });
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadModelsAndData();
            };
        }

        async function loadModelsAndData() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            try {
                statusText.innerText = "Initializing AI Models...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                await loadFacesFromDB();
                statusText.innerText = "System Ready.";
                startCamera();
            } catch (err) { statusText.innerText = "Load Error: " + err.message; }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: {} }).then(stream => { 
                video.srcObject = stream;
                video.style.display = "block";
                sleepMsg.style.display = "none";
                statusText.innerText = "Scanning for faces...";
                if (scanInterval) clearInterval(scanInterval);
                scanInterval = setInterval(scanFace, 2000); 
            }).catch(err => { statusText.innerText = "Camera Access Denied"; });
        }

        function stopCamera() {
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            video.style.display = "none";
            sleepMsg.style.display = "block";
            clearInterval(scanInterval);
            statusText.innerText = "Camera is OFF";
        }

        function toggleCamera() {
            isSleeping ? startCamera() : stopCamera();
            toggleBtn.innerText = isSleeping ? "Sleep Camera" : "Wake Camera";
            toggleBtn.className = isSleeping ? "btn-sleep" : "btn-wake";
            isSleeping = !isSleeping;
        }

        async function loadFacesFromDB() {
            const tx = db.transaction("members", "readonly");
            const members = await new Promise(r => tx.objectStore("members").getAll().onsuccess = e => r(e.target.result));
            registeredFaces = members.map(m => new faceapi.LabeledFaceDescriptors(m.name, [new Float32Array(m.descriptor)]));
        }

        
        async function scanFace() {
            if (registeredFaces.length === 0 || isSleeping) return;
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

            if (detection) {
                const faceMatcher = new faceapi.FaceMatcher(registeredFaces, 0.55);
                const match = faceMatcher.findBestMatch(detection.descriptor);

                if (match.label !== 'unknown') {
                    clearInterval(scanInterval); 
                    showCapturedUI(match.label);
                    saveAttendance(match.label);
                    setTimeout(() => { if (!isSleeping) scanInterval = setInterval(scanFace, 2000); }, 5000);
                }
            }
        }

        function showCapturedUI(name) {
            captureOverlay.innerText = "VERIFIED: " + name.toUpperCase();
            captureOverlay.style.background = "rgba(59, 130, 246, 0.9)";
            captureOverlay.style.display = "block";
            setTimeout(() => { 
                captureOverlay.style.display = "none"; 
                captureOverlay.innerText = "FACE CAPTURED"; 
            }, 3000);
        }

        function saveAttendance(name) {
            const now = new Date();
            const dateKey = now.toISOString().split('T')[0];
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const lastLog = localStorage.getItem('last_log_' + name);
            if (lastLog && (now - new Date(lastLog)) < 18000000) return; 

            const tx = db.transaction("attendance", "readwrite");
            tx.objectStore("attendance").add({ name, date: dateKey, time: timeStr, timestamp: now });
            tx.oncomplete = () => {
                localStorage.setItem('last_log_' + name, now);
                statusText.innerHTML = `✅ Recognized: <b>${name}</b> at ${timeStr}`;
            };
        }

        // --- Custom Alert Logic ---
function showAlert(message, title = "System Notification", type = "alert") {
    return new Promise((resolve) => {
        const overlay = document.getElementById('customAlert');
        const titleEl = document.getElementById('alertTitle');
        const msgEl = document.getElementById('alertMessage');
        const inputContainer = document.getElementById('alertInputContainer');
        const inputField = document.getElementById('alertInput');
        const confirmBtn = document.getElementById('alertConfirmBtn');
        const cancelBtn = document.getElementById('alertCancelBtn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        inputContainer.style.display = type === "prompt" ? "block" : "none";
        cancelBtn.style.display = type === "prompt" ? "block" : "none";
        inputField.value = "";
        overlay.style.display = "flex";

        confirmBtn.onclick = () => {
            overlay.style.display = "none";
            resolve(type === "prompt" ? inputField.value : true);
        };
        cancelBtn.onclick = () => {
            overlay.style.display = "none";
            resolve(null);
        };
    });
}

// --- UPDATED FUNCTIONS TO USE CUSTOM ALERT ---

async function registerFace() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return showAlert("Please enter a name first!");
    
    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    if (detection) {
        const tx = db.transaction("members", "readwrite");
        tx.objectStore("members").put({ name: name, descriptor: Array.from(detection.descriptor) });
        tx.oncomplete = async () => { 
            await showAlert(`Face for ${name} has been successfully registered.`, "Success!"); 
            loadFacesFromDB(); 
        };
    } else { 
        showAlert("No face detected. Please ensure you are visible in the camera.", "Detection Failed"); 
    }
}

async function openAttendanceWithAuth() {
    const pass = localStorage.getItem('sysPass') || "admin";
    const entry = await showAlert("Enter Access Password:", "Security Check", "prompt");
    
    if (entry === pass) {
        document.getElementById('recordsModal').style.display = 'block';
        document.getElementById('dateFilter').valueAsDate = new Date();
        loadAttendance();
    } else if (entry !== null) { 
        showAlert("The password you entered is incorrect.", "Access Denied"); 
    }
}

async function openSettings() {
    const pass = localStorage.getItem('sysPass') || "admin";
    const entry = await showAlert("Enter Admin Password:", "Settings Lock", "prompt");
    if(entry === pass) document.getElementById('settingsModal').style.display = 'block';
    else if (entry !== null) showAlert("Unauthorized access attempt.", "Denied");
}

async function saveSettings() {
    const newName = document.getElementById('setCompanyName').value;
    const newPass = document.getElementById('setPass').value;
    if(newName) {
        localStorage.setItem('companyName', newName);
        document.getElementById('displayCompanyName').innerText = newName;
    }
    if(newPass) localStorage.setItem('sysPass', newPass);
    
    await showAlert("System settings have been updated.", "Saved");
    closeModal('settingsModal');
}

function showCapturedUI(name) {
    // 1. Initial Display
    captureOverlay.innerHTML = `
        <div style="font-size: 16px; letter-spacing: 1px;">VERIFIED</div>
        <div style="font-size: 20px; margin: 5px 0;">${name.toUpperCase()}</div>
        <div id="countdown-wrapper" style="font-size: 12px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 5px;">
            Next scan in <span id="timer-num">5</span>s
        </div>
    `;
    
    captureOverlay.style.background = "rgba(34, 197, 94, 0.95)";
    captureOverlay.style.display = "block";

    // 2. Countdown Logic
    let timeLeft = 5;
    const timerInterval = setInterval(() => {
        timeLeft--;
        const timerNum = document.getElementById('timer-num');
        if (timerNum) {
            timerNum.innerText = timeLeft;
        }
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            captureOverlay.style.display = "none";
        }
    }, 1000);
}


        async function searchPerson() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!query) return alert("Enter a name to search");
            modalLogs.innerHTML = "Searching...";
            const tx = db.transaction("attendance", "readonly");
            const records = await new Promise(r => tx.objectStore("attendance").getAll().onsuccess = e => r(e.target.result));
            const filtered = records.filter(r => r.name.toLowerCase().includes(query));
            renderList(filtered, `No results for: ${query}`);
        }

        async function loadAttendance() {
            const date = document.getElementById('dateFilter').value;
            const tx = db.transaction("attendance", "readonly");
            const records = await new Promise(r => tx.objectStore("attendance").getAll().onsuccess = e => r(e.target.result));
            const filtered = records.filter(r => r.date === date);
            renderList(filtered);
        }

        function renderList(data, emptyMsg = "No records found") {
            modalLogs.innerHTML = "";
            if (data.length === 0) {
                modalLogs.innerHTML = `<div style='color:gray; text-align:center; padding:20px;'>${emptyMsg}</div>`;
                return;
            }
            data.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            data.forEach(r => {
                const div = document.createElement('div');
                div.className = "record-item";
                div.innerHTML = `<span>👤 ${r.name} <small style="color:gray">(${r.date})</small></span> <span>🕒 ${r.time}</span>`;
                modalLogs.appendChild(div);
            });
        }

        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        init();
        
    </script>
    <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registered!'))
      .catch(err => console.log('Registration failed: ', err));
  });
}
    </script>
    <div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <h3 id="alertTitle">Notification</h3>
        <p id="alertMessage"></p>
        <div id="alertInputContainer" style="display: none;">
            <input type="password" id="alertInput" placeholder="Enter here...">
        </div>
        <div class="button-group">
            <button id="alertConfirmBtn">OK</button>
            <button id="alertCancelBtn" class="btn-secondary" style="display: none;">Cancel</button>
        </div>
    </div>
</div>

</body>
</html>
